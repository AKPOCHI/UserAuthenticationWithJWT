name: Deploy to Namecheap VPS

on:
  push:
    branches:
      - main  # Change this to your production branch if different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Step 2: Setup .NET 10
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ✅ Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # ✅ Step 4: Build the application
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # ✅ Step 5: Run tests (uncomment if you have tests)
      # - name: Test
      #   run: dotnet test --no-restore --verbosity normal

      # ✅ Step 6: Publish the application
      - name: Publish
        run: dotnet publish --configuration Release --no-restore --output ./publish

      # ✅ Step 7: Stop service and clean old files on VPS
      - name: Prepare VPS for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}   # Switch to key: if using SSH key auth
          # key: ${{ secrets.VPS_SSH_KEY }}        # Uncomment for SSH key auth
          port: 22
          script: |
            sudo systemctl stop myapp.service || true
            rm -rf /var/www/myapp/*
            mkdir -p /var/www/myapp

      # ✅ Step 8: Copy published files to VPS
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "./publish/*"
          target: "/var/www/myapp"
          strip_components: 1

      # ✅ Step 9: Start the service and run migrations
      - name: Start app and run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/myapp

            # Apply EF Core migrations (remove if not using EF Core)
            dotnet ef database update || true

            # Start and enable the service
            sudo systemctl start myapp.service
            sudo systemctl enable myapp.service

            # Confirm it's running
            sudo systemctl status myapp.service --no-pager